# .github/workflows/paperclip-label-routing.yml
#
# GitHub-side half of the label -> Paperclip-agent routing. On issue open /
# label add, reads the issue's labels and routes:
#   - `spec`       -> commit the spec to the repo as spec/README_<id>.md +
#                     create a cancelled Paperclip reference ticket.
#   - `code-group` -> the SINGLE TRIGGER: the coordinator pulls all `code`
#                     tickets in the run (via `## Parent`), verifies the
#                     `## Blocked by` graph is closed, creates the Paperclip
#                     tickets (idempotent), wires the blocker edges, and
#                     assigns the first wave (no blockers) to the Coder.
#   - `code`       -> PASSIVE (no routing; the code-group coordinator pulls
#                     them).
# Paperclip natively wakes the assigned agent via the `issue_assigned` wake
# reason; the readiness gate sequences blocked tickets by the blockers'
# `done` state.
#
# Requires (per-repo, seeded by the Paperclip seeder at project connect time):
#   - .paperclip-routing.json at the repo root (companyId, projectId,
#     "code-group" -> agent)
#   - .github/paperclip-label-router.mjs (the router, shipped alongside)
#   - repo VARIABLE PAPERCLIP_URL   (Paperclip API base -- NOT baked in here)
#   - repo SECRET  PAPERCLIP_API_KEY (board-level Paperclip key)
#
# The coordinator lists code-labeled issues via the fine-grained PAT, so the
# workflow needs `issues: read`.
name: paperclip-label-routing

on:
  issues:
    types: [opened, labeled]

# The router reads the issue/repo via the fine-grained PAT (GH_API_TOKEN, a repo
# secret the seeder publishes) and POSTs to Paperclip. It needs no GITHUB_TOKEN.
permissions:
  contents: read
  issues: read

jobs:
  route:
    # Self-hosted runner on the Paperclip host (label: pc-paperclip) so the router
    # can reach the private Paperclip API. A GitHub-hosted runner cannot route to a
    # private LAN address, and the API base is passed via the PAPERCLIP_URL repo
    # variable (not committed here).
    runs-on: pc-paperclip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Node 20 has global fetch; the router reads GitHub via the PAT repo
      # secret (no `gh` binary required — it is not on the self-hosted runner).
      - name: Route label to Paperclip agent
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          PAPERCLIP_URL: ${{ vars.PAPERCLIP_URL }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ROUTING_FILE: .paperclip-routing.json
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GH_NUMBER: ${{ github.event.issue.number }}
          GH_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: node .github/paperclip-label-router.mjs
