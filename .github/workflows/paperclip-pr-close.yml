# .github/workflows/paperclip-pr-close.yml
#
# GitHub-side half: when a PR is closed (merged or discarded):
#   1. Mark the corresponding Paperclip ticket as `done`.
#   2. Reconciliation: wake ALL other active Paperclip tickets in the batch so
#      they can fetch main, rebase, and fix conflicts in real time.
#
# The PR body must reference the Paperclip ticket via a
# `Paperclip-Ticket: <identifier>` line (e.g. `Paperclip-Ticket: TEC-101`).
# The workflow reads the PR body, extracts the identifier, and PATCHes the
# Paperclip ticket to `done`. It also queries open PRs and posts comments on
# conflicted PRs to trigger rebases.
#
# Requires (per-repo, seeded by the Paperclip seeder):
#   - .paperclip-routing.json at the repo root (companyId, projectId)
#   - repo VARIABLE PAPERCLIP_URL   (Paperclip API base)
#   - repo SECRET  PAPERCLIP_API_KEY (board-level Paperclip key)
#
# The workflow uses the job-scoped GITHUB_TOKEN (no `gh` binary, no fine-grained
# PAT needed). It needs `pull-requests: write` to post comments on conflicted PRs.
name: paperclip-pr-close

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  close-ticket:
    runs-on: pc-paperclip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mark Paperclip ticket done + reconcile active tickets
        env:
          PAPERCLIP_URL: ${{ vars.PAPERCLIP_URL }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ROUTING_FILE: .paperclip-routing.json
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_PR_BODY: ${{ github.event.pull_request.body }}
          GH_PR_MERGED: ${{ github.event.pull_request.merged }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/paperclip-pr-close.mjs
